<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Speed — Foofy Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: #e0e0e0;
      padding: 2rem 1rem;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }
    .header a {
      color: #888;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .header a:hover { color: #fff; }
    h1 { font-size: 1.4rem; font-weight: 600; }

    .stats-bar {
      display: flex;
      gap: 2.5rem;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }
    .stat-label { color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 1.6rem; font-weight: 700; color: #7ec8e3; }
    .stat-value.timer { color: #e0e0e0; }

    .text-display {
      background: #1a1a2e;
      border: 2px solid #2a2a3e;
      border-radius: 8px;
      padding: 1.5rem 2rem;
      max-width: 720px;
      width: 100%;
      font-size: 1.25rem;
      line-height: 2;
      letter-spacing: 0.02em;
      margin-bottom: 1.5rem;
      min-height: 160px;
      position: relative;
      user-select: none;
    }
    .text-display .char {
      position: relative;
      transition: color 0.05s;
    }
    .text-display .char.correct { color: #4ade80; }
    .text-display .char.incorrect { color: #f87171; background: rgba(248,113,113,0.15); border-radius: 2px; }
    .text-display .char.current { border-bottom: 2px solid #7ec8e3; }
    .text-display .char.pending { color: #555; }
    .text-display .word-highlight {
      background: rgba(126,200,227,0.08);
      border-radius: 3px;
    }

    .input-area {
      max-width: 720px;
      width: 100%;
      margin-bottom: 1rem;
    }
    .input-area input {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 1.15rem;
      background: #1a1a2e;
      border: 2px solid #2a2a3e;
      border-radius: 8px;
      color: #e0e0e0;
      outline: none;
      font-family: system-ui, sans-serif;
    }
    .input-area input:focus { border-color: #7ec8e3; }
    .input-area input:disabled { opacity: 0.5; cursor: not-allowed; }

    .hint { color: #555; font-size: 0.85rem; margin-bottom: 2rem; }

    .results {
      background: #1a1a2e;
      border: 2px solid #2a2a3e;
      border-radius: 12px;
      padding: 2.5rem 3rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      display: none;
    }
    .results h2 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #7ec8e3; }
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .results-grid .stat-value { font-size: 2rem; }
    .results-grid .stat-label { margin-top: 0.25rem; }

    .btn {
      padding: 0.7rem 2rem;
      font-size: 1rem;
      background: #7ec8e3;
      color: #0f0f1a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn:hover { background: #5fb8d9; }
  </style>
</head>
<body>
  <div class="header">
    <a href="/">&larr; Back to games</a>
    <h1>Typing Speed</h1>
  </div>

  <div class="stats-bar" id="stats-bar">
    <div><div class="stat-label">Time</div><div class="stat-value timer" id="timer">60</div></div>
    <div><div class="stat-label">WPM</div><div class="stat-value" id="wpm">0</div></div>
    <div><div class="stat-label">Accuracy</div><div class="stat-value" id="accuracy">100%</div></div>
  </div>

  <div class="text-display" id="text-display"></div>

  <div class="input-area" id="input-area">
    <input type="text" id="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Start typing to begin...">
  </div>
  <div class="hint" id="hint">Timer starts on your first keystroke</div>

  <div class="results" id="results">
    <h2>Results</h2>
    <div class="results-grid">
      <div><div class="stat-value" id="r-wpm">0</div><div class="stat-label">WPM</div></div>
      <div><div class="stat-value" id="r-accuracy">0%</div><div class="stat-label">Accuracy</div></div>
      <div><div class="stat-value" id="r-chars">0</div><div class="stat-label">Characters</div></div>
    </div>
    <button class="btn" id="play-again">Play Again</button>
  </div>

<script>
const passages = [
  "The quick brown fox jumps over the lazy dog while the sun sets behind the distant mountains casting long shadows across the valley below.",
  "Programming is the art of telling a computer what to do through a set of carefully crafted instructions that must be precise and unambiguous.",
  "Every great journey begins with a single step and the courage to keep moving forward even when the path ahead seems uncertain and full of challenges.",
  "The ocean waves crashed against the rocky shore sending sprays of salt water high into the cool morning air as seagulls circled overhead.",
  "In the heart of the forest ancient trees stood like silent guardians their roots intertwined beneath the mossy ground creating a hidden network.",
  "Music has the power to transport us to different times and places evoking memories and emotions that words alone could never fully capture.",
  "The city skyline glittered with a thousand lights as the evening commuters hurried home through crowded streets filled with the sounds of traffic.",
  "Science and technology continue to reshape our world in ways that previous generations could never have imagined or even dreamed possible.",
  "A good book can open doors to new worlds and perspectives challenging our assumptions and expanding our understanding of the human experience.",
  "The chef carefully arranged each ingredient on the plate transforming simple foods into a work of art that delighted both the eyes and the palate.",
  "Stars filled the night sky like scattered diamonds on dark velvet while crickets played their endless symphony in the tall grass below.",
  "Learning a new skill requires patience and dedication but the rewards of personal growth and accomplishment make every moment of effort worthwhile.",
  "The old lighthouse stood firm against the raging storm its beacon cutting through the darkness to guide lost sailors safely back to the harbor.",
  "Creativity thrives when we allow ourselves the freedom to experiment make mistakes and explore ideas without fear of judgment or failure."
];

let currentText = "";
let charIndex = 0;
let started = false;
let finished = false;
let timerInterval = null;
let timeLeft = 60;
let totalKeystrokes = 0;
let correctKeystrokes = 0;

const display = document.getElementById("text-display");
const input = document.getElementById("input");
const timerEl = document.getElementById("timer");
const wpmEl = document.getElementById("wpm");
const accuracyEl = document.getElementById("accuracy");
const hintEl = document.getElementById("hint");
const resultsEl = document.getElementById("results");
const statsBar = document.getElementById("stats-bar");
const inputArea = document.getElementById("input-area");

function pickPassage() {
  return passages[Math.floor(Math.random() * passages.length)];
}

function renderText() {
  display.innerHTML = "";
  let wordStart = 0;
  const words = [];
  // find word boundaries
  for (let i = 0; i <= currentText.length; i++) {
    if (i === currentText.length || currentText[i] === " ") {
      words.push({ start: wordStart, end: i });
      wordStart = i + 1;
    }
  }
  // find which word the cursor is in
  let currentWord = null;
  for (const w of words) {
    if (charIndex >= w.start && charIndex < w.end) { currentWord = w; break; }
  }
  // if cursor is on a space between words, highlight next word
  if (!currentWord && charIndex < currentText.length) {
    for (const w of words) {
      if (charIndex < w.start) { currentWord = w; break; }
    }
  }

  for (let i = 0; i < currentText.length; i++) {
    const span = document.createElement("span");
    span.className = "char";
    span.textContent = currentText[i];

    if (i < charIndex) {
      // already typed
      span.classList.add(span.dataset.correct !== "false" ? "correct" : "incorrect");
    } else if (i === charIndex) {
      span.classList.add("current", "pending");
    } else {
      span.classList.add("pending");
    }
    // word highlight
    if (currentWord && i >= currentWord.start && i < currentWord.end) {
      span.classList.add("word-highlight");
    }
    display.appendChild(span);
  }
}

// We store per-character correctness
let charResults = [];

function renderUpdate() {
  const spans = display.querySelectorAll(".char");
  // find current word
  let wordStart = 0;
  const words = [];
  for (let i = 0; i <= currentText.length; i++) {
    if (i === currentText.length || currentText[i] === " ") {
      words.push({ start: wordStart, end: i });
      wordStart = i + 1;
    }
  }
  let currentWord = null;
  for (const w of words) {
    if (charIndex >= w.start && charIndex < w.end) { currentWord = w; break; }
  }
  if (!currentWord && charIndex < currentText.length) {
    for (const w of words) {
      if (charIndex < w.start) { currentWord = w; break; }
    }
  }

  for (let i = 0; i < spans.length; i++) {
    const span = spans[i];
    span.className = "char";
    if (i < charIndex) {
      span.classList.add(charResults[i] ? "correct" : "incorrect");
    } else if (i === charIndex) {
      span.classList.add("current", "pending");
    } else {
      span.classList.add("pending");
    }
    if (currentWord && i >= currentWord.start && i < currentWord.end) {
      span.classList.add("word-highlight");
    }
  }
}

function startTimer() {
  started = true;
  hintEl.style.display = "none";
  const startTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = (Date.now() - startTime) / 1000;
    timeLeft = Math.max(0, 60 - Math.floor(elapsed));
    timerEl.textContent = timeLeft;
    updateLiveStats(elapsed);
    if (timeLeft <= 0) endGame();
  }, 200);
}

function updateLiveStats(elapsedSec) {
  if (elapsedSec < 0.5) return;
  // count correct characters so far
  const correctChars = charResults.filter(Boolean).length;
  const wpm = Math.round((correctChars / 5) / (elapsedSec / 60));
  wpmEl.textContent = wpm;
  const acc = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;
  accuracyEl.textContent = acc + "%";
}

function endGame() {
  finished = true;
  clearInterval(timerInterval);
  input.disabled = true;
  const elapsed = 60 - timeLeft || 60;
  const correctChars = charResults.filter(Boolean).length;
  const finalWpm = Math.round((correctChars / 5) / (elapsed / 60));
  const finalAcc = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;

  statsBar.style.display = "none";
  inputArea.style.display = "none";
  display.style.display = "none";

  document.getElementById("r-wpm").textContent = finalWpm;
  document.getElementById("r-accuracy").textContent = finalAcc + "%";
  document.getElementById("r-chars").textContent = charIndex;
  resultsEl.style.display = "block";
}

function init() {
  currentText = pickPassage();
  charIndex = 0;
  charResults = [];
  started = false;
  finished = false;
  timeLeft = 60;
  totalKeystrokes = 0;
  correctKeystrokes = 0;
  clearInterval(timerInterval);

  timerEl.textContent = "60";
  wpmEl.textContent = "0";
  accuracyEl.textContent = "100%";

  statsBar.style.display = "flex";
  inputArea.style.display = "block";
  display.style.display = "block";
  resultsEl.style.display = "none";
  hintEl.style.display = "block";

  input.disabled = false;
  input.value = "";
  input.focus();

  renderText();
}

input.addEventListener("input", (e) => {
  if (finished) return;
  if (!started) startTimer();

  const val = e.data;
  // handle the input as a stream of characters
  // On each input event we compare the full input value length to charIndex
  // But simpler: we react to each character
});

// Use keydown for precise control
input.addEventListener("keydown", (e) => {
  if (finished) return;

  if (e.key === "Backspace") {
    // no backspace allowed — keep it simple, or allow it:
    if (charIndex > 0) {
      charIndex--;
      // undo the last result
      charResults.pop();
      renderUpdate();
      // clear input to stay in sync
      e.preventDefault();
      input.value = input.value.slice(0, -1);
    } else {
      e.preventDefault();
    }
    return;
  }

  // Ignore non-character keys
  if (e.key.length !== 1) return;

  if (!started) startTimer();

  e.preventDefault();

  if (charIndex >= currentText.length) return;

  totalKeystrokes++;
  const expected = currentText[charIndex];
  const typed = e.key;
  const isCorrect = typed === expected;
  if (isCorrect) correctKeystrokes++;

  charResults.push(isCorrect);
  charIndex++;

  // Append to input for visual feedback
  input.value += typed;

  renderUpdate();

  // If we've typed everything, end immediately
  if (charIndex >= currentText.length) {
    endGame();
  }
});

document.getElementById("play-again").addEventListener("click", init);

// Focus input when clicking the text display
display.addEventListener("click", () => { if (!finished) input.focus(); });

init();
</script>
</body>
</html>
