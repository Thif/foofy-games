<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    overflow: hidden;
    touch-action: none;
  }
  a { color: #8888cc; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .back-link {
    align-self: flex-start;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .back-link::before { content: "\2190 "; }
  h1 {
    font-size: 48px;
    font-weight: 800;
    color: #f0c040;
    margin-bottom: 12px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 420px;
    margin-bottom: 16px;
  }
  .scores {
    display: flex;
    gap: 10px;
  }
  .score-box {
    background: #1a1a2e;
    border: 1px solid #2a2a3e;
    border-radius: 8px;
    padding: 8px 16px;
    text-align: center;
    min-width: 80px;
  }
  .score-box .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
  }
  .score-box .value {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
  }
  .btn {
    background: #2a2a4e;
    color: #e0e0e0;
    border: 1px solid #3a3a5e;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: #3a3a5e; }
  .board-container {
    position: relative;
    width: 420px;
    height: 420px;
    max-width: calc(100vw - 40px);
    max-height: calc(100vw - 40px);
  }
  .board {
    width: 100%;
    height: 100%;
    background: #1a1a2e;
    border-radius: 12px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }
  .cell {
    background: #252540;
    border-radius: 8px;
  }
  .tile-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    border-radius: 8px;
    transition: top 0.12s ease, left 0.12s ease;
    z-index: 1;
  }
  .tile.merged {
    animation: pop 0.2s ease;
    z-index: 2;
  }
  .tile.new {
    animation: appear 0.2s ease;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  @keyframes appear {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 15, 26, 0.85);
    border-radius: 12px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.active { display: flex; }
  .overlay h2 { font-size: 36px; margin-bottom: 16px; }
  .overlay .btn { margin: 6px; }
  .overlay.win h2 { color: #f0c040; }
  .overlay.lose h2 { color: #cc4444; }
</style>
</head>
<body>
<a href="/" class="back-link">Tilbake til spill</a>
<h1>2048</h1>
<div class="header">
  <div class="scores">
    <div class="score-box"><div class="label">Poeng</div><div class="value" id="score">0</div></div>
    <div class="score-box"><div class="label">Beste</div><div class="value" id="best">0</div></div>
  </div>
  <button class="btn" id="new-game-btn">Nytt spill</button>
</div>
<div class="board-container" id="container">
  <div class="board" id="board"></div>
  <div class="tile-layer" id="tile-layer"></div>
  <div class="overlay win" id="win-overlay">
    <h2>Du nådde 2048!</h2>
    <button class="btn" id="continue-btn">Fortsett å spille</button>
    <button class="btn" id="win-new-btn">Nytt spill</button>
  </div>
  <div class="overlay lose" id="lose-overlay">
    <h2>Spillet er over</h2>
    <button class="btn" id="lose-new-btn">Nytt spill</button>
  </div>
</div>

<script>
(function() {
  const SIZE = 4;
  let grid, score, best, won, continued, moving;

  const TILE_COLORS = {
    2:    { bg: '#3b3b5c', fg: '#e0e0e0' },
    4:    { bg: '#4a4a6a', fg: '#e0e0e0' },
    8:    { bg: '#c07030', fg: '#fff' },
    16:   { bg: '#d06030', fg: '#fff' },
    32:   { bg: '#e04840', fg: '#fff' },
    64:   { bg: '#cc3030', fg: '#fff' },
    128:  { bg: '#e0c040', fg: '#fff' },
    256:  { bg: '#e0b830', fg: '#fff' },
    512:  { bg: '#e0a020', fg: '#fff' },
    1024: { bg: '#e08810', fg: '#fff' },
    2048: { bg: '#f0c040', fg: '#fff' },
  };
  function tileStyle(val) {
    return TILE_COLORS[val] || { bg: '#aa60ff', fg: '#fff' };
  }

  const boardEl = document.getElementById('board');
  const tileLayer = document.getElementById('tile-layer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const winOverlay = document.getElementById('win-overlay');
  const loseOverlay = document.getElementById('lose-overlay');
  const container = document.getElementById('container');

  // Build background grid cells
  for (let i = 0; i < SIZE * SIZE; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    boardEl.appendChild(c);
  }

  function getTileSize() {
    const w = container.offsetWidth;
    const padding = 10;
    const gap = 10;
    return (w - padding * 2 - gap * (SIZE - 1)) / SIZE;
  }
  function getTilePos(r, c) {
    const w = container.offsetWidth;
    const padding = 10;
    const gap = 10;
    const ts = getTileSize();
    return {
      left: padding + c * (ts + gap),
      top: padding + r * (ts + gap)
    };
  }

  function init() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    won = false;
    continued = false;
    moving = false;
    winOverlay.classList.remove('active');
    loseOverlay.classList.remove('active');
    best = parseInt(localStorage.getItem('2048_best') || '0', 10);
    updateScore();
    addRandom();
    addRandom();
    renderTiles();
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('2048_best', best);
    }
    bestEl.textContent = best;
  }

  function emptyPositions() {
    const pos = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) pos.push([r, c]);
    return pos;
  }

  function addRandom() {
    const empty = emptyPositions();
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    return [r, c];
  }

  function fontSize(val) {
    const ts = getTileSize();
    if (val < 100) return ts * 0.45 + 'px';
    if (val < 1000) return ts * 0.38 + 'px';
    return ts * 0.3 + 'px';
  }

  function createTileEl(r, c, val, cls) {
    const el = document.createElement('div');
    el.className = 'tile' + (cls ? ' ' + cls : '');
    const ts = getTileSize();
    const pos = getTilePos(r, c);
    const s = tileStyle(val);
    Object.assign(el.style, {
      width: ts + 'px', height: ts + 'px',
      left: pos.left + 'px', top: pos.top + 'px',
      background: s.bg, color: s.fg,
      fontSize: fontSize(val)
    });
    el.textContent = val;
    return el;
  }

  function renderTiles() {
    tileLayer.innerHTML = '';
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c])
          tileLayer.appendChild(createTileEl(r, c, grid[r][c]));
  }

  // Slide a single row left, return { row, score, merged, moves }
  function slideRow(row) {
    let s = 0;
    const merged = [];
    const moves = [];
    const filtered = [];
    const origIdx = [];
    for (let i = 0; i < row.length; i++) {
      if (row[i] !== 0) { filtered.push(row[i]); origIdx.push(i); }
    }
    const result = Array(SIZE).fill(0);
    let pos = 0;
    for (let i = 0; i < filtered.length; i++) {
      if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
        result[pos] = filtered[i] * 2;
        s += result[pos];
        merged.push(pos);
        moves.push({ from: origIdx[i], to: pos });
        moves.push({ from: origIdx[i + 1], to: pos, merge: true });
        i++;
      } else {
        result[pos] = filtered[i];
        moves.push({ from: origIdx[i], to: pos });
      }
      pos++;
    }
    return { row: result, score: s, merged, moves };
  }

  function cloneGrid() { return grid.map(r => r.slice()); }

  function move(dir) {
    // dir: 0=left, 1=up, 2=right, 3=down
    if (moving) return false;
    const old = cloneGrid();
    let totalScore = 0;
    const allAnimations = []; // { fromR, fromC, toR, toC, val, merge }

    for (let i = 0; i < SIZE; i++) {
      let row;
      if (dir === 0) row = grid[i].slice();
      else if (dir === 2) row = grid[i].slice().reverse();
      else if (dir === 1) row = [grid[0][i], grid[1][i], grid[2][i], grid[3][i]];
      else row = [grid[3][i], grid[2][i], grid[1][i], grid[0][i]];

      const { row: newRow, score: s, moves } = slideRow(row);
      totalScore += s;

      for (const m of moves) {
        let fromR, fromC, toR, toC;
        if (dir === 0) { fromR = toR = i; fromC = m.from; toC = m.to; }
        else if (dir === 2) { fromR = toR = i; fromC = 3 - m.from; toC = 3 - m.to; }
        else if (dir === 1) { fromC = toC = i; fromR = m.from; toR = m.to; }
        else { fromC = toC = i; fromR = 3 - m.from; toR = 3 - m.to; }
        allAnimations.push({ fromR, fromC, toR, toC, val: row[m.from], merge: m.merge, mergedVal: m.merge ? row[m.from] * 2 : row[m.from] });
      }

      if (dir === 0) grid[i] = newRow;
      else if (dir === 2) { newRow.reverse(); grid[i] = newRow; }
      else if (dir === 1) for (let j = 0; j < SIZE; j++) grid[j][i] = newRow[j];
      else for (let j = 0; j < SIZE; j++) grid[3 - j][i] = newRow[j];
    }

    // Check if anything changed
    let changed = false;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (old[r][c] !== grid[r][c]) changed = true;

    if (!changed) return false;

    moving = true;
    score += totalScore;
    updateScore();

    // Animate
    tileLayer.innerHTML = '';
    const mergedPositions = new Set();

    for (const a of allAnimations) {
      const fromPos = getTilePos(a.fromR, a.fromC);
      const toPos = getTilePos(a.toR, a.toC);
      const ts = getTileSize();
      const s = tileStyle(a.val);
      const el = document.createElement('div');
      el.className = 'tile';
      Object.assign(el.style, {
        width: ts + 'px', height: ts + 'px',
        left: fromPos.left + 'px', top: fromPos.top + 'px',
        background: s.bg, color: s.fg,
        fontSize: fontSize(a.val)
      });
      el.textContent = a.val;
      tileLayer.appendChild(el);

      // Force layout then animate
      el._toR = a.toR; el._toC = a.toC;
      el._merge = a.merge;
      if (a.merge) mergedPositions.add(a.toR + ',' + a.toC);
    }

    // Trigger transitions
    requestAnimationFrame(() => {
      const tiles = tileLayer.querySelectorAll('.tile');
      tiles.forEach(el => {
        const toPos = getTilePos(el._toR, el._toC);
        el.style.left = toPos.left + 'px';
        el.style.top = toPos.top + 'px';
      });
    });

    setTimeout(() => {
      // Add new tile
      const newPos = addRandom();
      // Re-render everything cleanly
      tileLayer.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c]) {
            let cls = '';
            if (mergedPositions.has(r + ',' + c)) cls = 'merged';
            if (newPos && newPos[0] === r && newPos[1] === c) cls = 'new';
            tileLayer.appendChild(createTileEl(r, c, grid[r][c], cls));
          }
        }
      }
      moving = false;

      // Check win
      if (!won && !continued) {
        for (let r = 0; r < SIZE; r++)
          for (let c = 0; c < SIZE; c++)
            if (grid[r][c] === 2048) { won = true; winOverlay.classList.add('active'); return; }
      }

      // Check game over
      if (isGameOver()) loseOverlay.classList.add('active');
    }, 140);

    return true;
  }

  function isGameOver() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return false;
        if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return false;
        if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return false;
      }
    return true;
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    const map = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3 };
    if (map[e.key] !== undefined) { e.preventDefault(); move(map[e.key]); }
  });

  // Swipe
  let touchStartX, touchStartY;
  container.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });
  container.addEventListener('touchend', e => {
    if (touchStartX == null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absDx = Math.abs(dx), absDy = Math.abs(dy);
    if (Math.max(absDx, absDy) < 30) return;
    if (absDx > absDy) move(dx > 0 ? 2 : 0);
    else move(dy > 0 ? 3 : 1);
    touchStartX = touchStartY = null;
  }, { passive: true });

  // Buttons
  document.getElementById('new-game-btn').addEventListener('click', init);
  document.getElementById('win-new-btn').addEventListener('click', init);
  document.getElementById('lose-new-btn').addEventListener('click', init);
  document.getElementById('continue-btn').addEventListener('click', () => {
    continued = true;
    winOverlay.classList.remove('active');
  });

  // Handle resize
  window.addEventListener('resize', renderTiles);

  init();
})();
</script>
</body>
</html>
