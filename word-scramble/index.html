<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Scramble — Foofy Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: #e0e0e0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-bottom: 1rem;
    }
    .header a {
      color: #888;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .header a:hover { color: #fff; }

    .game-container {
      background: #1a1a2e;
      border: 2px solid #2a2a3e;
      border-radius: 12px;
      padding: 2rem 2.5rem;
      width: 420px;
      max-width: 95vw;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 1rem;
    }
    .stats-bar .score { color: #6ee06e; }
    .stats-bar .timer { color: #e0c36e; }
    .stats-bar .round { color: #8888cc; }

    .scrambled-word {
      font-size: 2.4rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      color: #c0c0ff;
      margin: 1.5rem 0;
      min-height: 3rem;
      text-transform: uppercase;
    }

    .hint {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 1rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    #guess-input {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 2px solid #2a2a3e;
      border-radius: 8px;
      background: #12122a;
      color: #fff;
      font-size: 1.1rem;
      text-transform: lowercase;
      outline: none;
      transition: border-color 0.2s;
    }
    #guess-input:focus {
      border-color: #5555aa;
    }

    button {
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.96); }

    .btn-submit {
      background: #4a4aaa;
      color: #fff;
    }
    .btn-submit:hover { background: #5c5cc0; }

    .btn-skip {
      background: #3a3a4e;
      color: #aaa;
    }
    .btn-skip:hover { background: #4a4a5e; color: #ddd; }

    .btn-play {
      background: #4a4aaa;
      color: #fff;
      font-size: 1.1rem;
      padding: 0.8rem 2rem;
      margin-top: 1rem;
    }
    .btn-play:hover { background: #5c5cc0; }

    .feedback {
      font-size: 1.1rem;
      min-height: 1.6rem;
      margin-bottom: 0.5rem;
      font-weight: bold;
      transition: opacity 0.3s;
    }
    .feedback.correct { color: #6ee06e; }
    .feedback.wrong { color: #e06e6e; }
    .feedback.timeout { color: #e0c36e; }

    .answer-reveal {
      font-size: 0.95rem;
      color: #999;
      min-height: 1.4rem;
      margin-bottom: 0.5rem;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #2a2a3e;
      border-radius: 3px;
      margin-top: 1rem;
      overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%;
      background: #e0c36e;
      border-radius: 3px;
      transition: width 0.3s;
    }

    .results {
      display: none;
    }
    .results h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .results .final-score {
      font-size: 3rem;
      font-weight: bold;
      color: #6ee06e;
      margin: 1rem 0;
    }
    .results .final-label {
      color: #888;
      font-size: 1rem;
    }
    .results .summary {
      color: #aaa;
      font-size: 0.95rem;
      margin: 0.5rem 0 1rem;
    }

    .start-screen {
      padding: 1rem 0;
    }
    .start-screen p {
      color: #999;
      margin: 0.8rem 0 1.5rem;
      line-height: 1.5;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s; }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 0.3s; }
  </style>
</head>
<body>
  <div class="header">
    <a href="/">&#8592; Back to games</a>
  </div>

  <div class="game-container" id="game">
    <!-- Start Screen -->
    <div class="start-screen" id="start-screen">
      <h1>Word Scramble</h1>
      <p>Unscramble as many words as you can in 60 seconds. Type the correct word and press Enter or click Submit.</p>
      <button class="btn-play" onclick="startGame()">Start Game</button>
    </div>

    <!-- Play Screen -->
    <div id="play-screen" style="display:none;">
      <div class="stats-bar">
        <span class="score">Score: <strong id="score">0</strong></span>
        <span class="round">Word <strong id="word-num">1</strong></span>
        <span class="timer" id="timer">60s</span>
      </div>

      <div class="scrambled-word" id="scrambled"></div>
      <div class="hint" id="hint"></div>

      <div class="feedback" id="feedback"></div>
      <div class="answer-reveal" id="answer-reveal"></div>

      <div class="input-row">
        <input type="text" id="guess-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your guess...">
        <button class="btn-submit" onclick="submitGuess()">Submit</button>
        <button class="btn-skip" onclick="skipWord()">Skip</button>
      </div>

      <div class="progress-bar">
        <div class="fill" id="timer-bar"></div>
      </div>
    </div>

    <!-- Results Screen -->
    <div class="results" id="results-screen">
      <h2>Time's Up!</h2>
      <div class="final-label">Final Score</div>
      <div class="final-score" id="final-score">0</div>
      <div class="summary" id="summary"></div>
      <button class="btn-play" onclick="startGame()">Play Again</button>
    </div>
  </div>

  <script>
    const WORDS = [
      "apple", "brave", "chair", "dance", "eagle", "flame", "grape", "house",
      "juice", "knife", "lemon", "maple", "night", "ocean", "piano", "queen",
      "river", "stone", "tiger", "unity", "voice", "whale", "yield", "zebra",
      "brush", "cloud", "dream", "frost", "globe", "heart", "ivory", "jolly",
      "lunar", "magic", "noble", "orbit", "pearl", "quiet", "royal", "solar",
      "train", "ultra", "vivid", "wrist", "amber", "blaze", "crest", "drift",
      "ember", "forge", "ghost", "haven", "index", "jazzy", "kneel", "lotus",
      "mango", "nexus", "olive", "plume", "quilt", "robin", "skull", "thorn",
      "umbra", "vapor", "waltz", "pixel", "yacht", "zesty", "album", "badge",
      "camel", "delta", "elbow", "fiber", "grain", "humor", "input", "jewel"
    ];

    let score = 0;
    let wordCount = 0;
    let currentWord = "";
    let timeLeft = 60;
    let timerInterval = null;
    let usedWords = [];
    let waiting = false;

    function scramble(word) {
      let arr = word.split("");
      let scrambled = arr.slice();
      let attempts = 0;
      do {
        for (let i = scrambled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [scrambled[i], scrambled[j]] = [scrambled[j], scrambled[i]];
        }
        attempts++;
      } while (scrambled.join("") === word && attempts < 20);
      return scrambled.join("");
    }

    function pickWord() {
      const available = WORDS.filter(w => !usedWords.includes(w));
      if (available.length === 0) {
        usedWords = [];
        return pickWord();
      }
      const word = available[Math.floor(Math.random() * available.length)];
      usedWords.push(word);
      return word;
    }

    function showNextWord() {
      if (timeLeft <= 0) return;
      waiting = false;
      wordCount++;
      currentWord = pickWord();
      document.getElementById("scrambled").textContent = scramble(currentWord);
      document.getElementById("hint").textContent = currentWord.length + " letters";
      document.getElementById("word-num").textContent = wordCount;
      document.getElementById("feedback").textContent = "";
      document.getElementById("feedback").className = "feedback";
      document.getElementById("answer-reveal").textContent = "";
      document.getElementById("guess-input").value = "";
      document.getElementById("guess-input").disabled = false;
      document.getElementById("guess-input").focus();
    }

    function submitGuess() {
      if (waiting || timeLeft <= 0) return;
      const input = document.getElementById("guess-input");
      const guess = input.value.trim().toLowerCase();
      if (!guess) return;

      const fb = document.getElementById("feedback");
      const reveal = document.getElementById("answer-reveal");

      if (guess === currentWord) {
        score++;
        document.getElementById("score").textContent = score;
        fb.textContent = "Correct!";
        fb.className = "feedback correct";
        document.getElementById("scrambled").classList.add("pop");
        setTimeout(() => document.getElementById("scrambled").classList.remove("pop"), 300);
        reveal.textContent = "";
        input.disabled = true;
        waiting = true;
        setTimeout(showNextWord, 800);
      } else {
        fb.textContent = "Wrong!";
        fb.className = "feedback wrong";
        reveal.textContent = "The word was: " + currentWord;
        input.classList.add("shake");
        setTimeout(() => input.classList.remove("shake"), 400);
        input.disabled = true;
        waiting = true;
        setTimeout(showNextWord, 1500);
      }
    }

    function skipWord() {
      if (waiting || timeLeft <= 0) return;
      const fb = document.getElementById("feedback");
      const reveal = document.getElementById("answer-reveal");
      fb.textContent = "Skipped";
      fb.className = "feedback timeout";
      reveal.textContent = "The word was: " + currentWord;
      document.getElementById("guess-input").disabled = true;
      waiting = true;
      setTimeout(showNextWord, 1500);
    }

    function updateTimer() {
      timeLeft--;
      document.getElementById("timer").textContent = timeLeft + "s";
      document.getElementById("timer-bar").style.width = (timeLeft / 60 * 100) + "%";

      if (timeLeft <= 10) {
        document.getElementById("timer").style.color = "#e06e6e";
      }

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        endGame();
      }
    }

    function endGame() {
      document.getElementById("play-screen").style.display = "none";
      document.getElementById("results-screen").style.display = "block";
      document.getElementById("final-score").textContent = score;
      const total = wordCount;
      document.getElementById("summary").textContent =
        "You got " + score + " out of " + total + " words correct.";
    }

    function startGame() {
      score = 0;
      wordCount = 0;
      timeLeft = 60;
      usedWords = [];
      waiting = false;

      document.getElementById("start-screen").style.display = "none";
      document.getElementById("results-screen").style.display = "none";
      document.getElementById("play-screen").style.display = "block";
      document.getElementById("score").textContent = "0";
      document.getElementById("timer").textContent = "60s";
      document.getElementById("timer").style.color = "#e0c36e";
      document.getElementById("timer-bar").style.width = "100%";

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);

      showNextWord();
    }

    document.getElementById("guess-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter") submitGuess();
    });
  </script>
</body>
</html>
