<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Trivia - Foofy Games</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  a { color: #7eb8ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .back-link {
    position: fixed;
    top: 16px;
    left: 16px;
    font-size: 14px;
    z-index: 100;
    background: rgba(15,15,26,0.85);
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid #2a2a4a;
  }
  .back-link::before { content: "\2190 "; }
  .container {
    max-width: 700px;
    width: 100%;
    padding: 20px;
    margin-top: 60px;
  }
  h1 {
    text-align: center;
    font-size: 2.2em;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #7eb8ff, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 32px;
    font-size: 1.05em;
  }

  /* Category Selection */
  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
    margin-top: 20px;
  }
  .cat-btn {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    padding: 22px 16px;
    color: #e0e0e0;
    font-size: 1.05em;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .cat-btn:hover {
    border-color: #7eb8ff;
    background: #1e1e36;
    transform: translateY(-2px);
  }
  .cat-btn .icon { font-size: 1.8em; display: block; margin-bottom: 8px; }
  .cat-btn.all { border-color: #c084fc; }
  .cat-btn.all:hover { border-color: #d4a0ff; background: #221e36; }

  /* Quiz Screen */
  .progress-bar-wrap {
    width: 100%;
    height: 8px;
    background: #1a1a2e;
    border-radius: 4px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #7eb8ff, #c084fc);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 0.95em;
    color: #888;
  }
  .timer {
    font-size: 1.4em;
    font-weight: bold;
    color: #7eb8ff;
    min-width: 48px;
    text-align: center;
  }
  .timer.warning { color: #ff6b6b; animation: pulse 0.5s infinite alternate; }
  @keyframes pulse { to { opacity: 0.5; } }
  .category-tag {
    background: #2a2a4a;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.82em;
    color: #aaa;
  }
  .question-text {
    font-size: 1.3em;
    line-height: 1.5;
    margin: 20px 0 28px;
    min-height: 80px;
  }
  .answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 500px) { .answers { grid-template-columns: 1fr; } }
  .answer-btn {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 10px;
    padding: 16px;
    color: #e0e0e0;
    font-size: 1em;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .answer-btn:hover:not(.disabled) {
    border-color: #7eb8ff;
    background: #1e1e36;
  }
  .answer-btn.correct {
    border-color: #4ade80;
    background: rgba(74, 222, 128, 0.15);
    color: #4ade80;
  }
  .answer-btn.wrong {
    border-color: #ff6b6b;
    background: rgba(255, 107, 107, 0.15);
    color: #ff6b6b;
  }
  .answer-btn.disabled { cursor: default; opacity: 0.6; }
  .answer-btn .letter {
    display: inline-block;
    width: 26px;
    height: 26px;
    line-height: 26px;
    text-align: center;
    border-radius: 6px;
    background: #2a2a4a;
    margin-right: 10px;
    font-weight: bold;
    font-size: 0.85em;
    flex-shrink: 0;
  }
  .answer-btn.correct .letter { background: #4ade80; color: #0f0f1a; }
  .answer-btn.wrong .letter { background: #ff6b6b; color: #0f0f1a; }

  /* Results */
  .results-card {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 16px;
    padding: 36px;
    text-align: center;
    margin-top: 16px;
  }
  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 6px solid #2a2a4a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    position: relative;
  }
  .score-circle.great { border-color: #4ade80; }
  .score-circle.ok { border-color: #facc15; }
  .score-circle.bad { border-color: #ff6b6b; }
  .score-num { font-size: 2.6em; font-weight: bold; }
  .score-label { font-size: 0.85em; color: #888; }
  .stats-row {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin: 20px 0 28px;
  }
  .stat { text-align: center; }
  .stat-val { font-size: 1.4em; font-weight: bold; color: #c084fc; }
  .stat-lbl { font-size: 0.82em; color: #888; margin-top: 2px; }
  .btn {
    background: linear-gradient(135deg, #7eb8ff, #c084fc);
    border: none;
    border-radius: 10px;
    padding: 14px 32px;
    color: #0f0f1a;
    font-size: 1.05em;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
    margin: 6px;
  }
  .btn:hover { opacity: 0.85; }
  .btn-secondary {
    background: #2a2a4a;
    color: #e0e0e0;
  }

  /* Review */
  .review-section { margin-top: 28px; text-align: left; }
  .review-section h3 { margin-bottom: 16px; text-align: center; color: #aaa; }
  .review-item {
    background: #12121f;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 10px;
    border-left: 4px solid #2a2a4a;
  }
  .review-item.was-correct { border-left-color: #4ade80; }
  .review-item.was-wrong { border-left-color: #ff6b6b; }
  .review-q { font-weight: 600; margin-bottom: 6px; }
  .review-a { font-size: 0.9em; color: #888; }
  .review-a span { color: #4ade80; font-weight: 600; }
  .review-your { font-size: 0.9em; color: #ff6b6b; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<a href="/" class="back-link">Tilbake til spill</a>

<div class="container">
  <!-- CATEGORY SCREEN -->
  <div id="screen-category">
    <h1>Quiz</h1>
    <p class="subtitle">Test kunnskapen din med spennende spørsmål</p>
    <div class="category-grid">
      <button class="cat-btn all" onclick="startQuiz('all')">
        <span class="icon">&#127922;</span>Alle kategorier
      </button>
      <button class="cat-btn" onclick="startQuiz('Vitenskap')">
        <span class="icon">&#129514;</span>Vitenskap
      </button>
      <button class="cat-btn" onclick="startQuiz('Historie')">
        <span class="icon">&#127984;</span>Historie
      </button>
      <button class="cat-btn" onclick="startQuiz('Geografi')">
        <span class="icon">&#127758;</span>Geografi
      </button>
      <button class="cat-btn" onclick="startQuiz('Sport')">
        <span class="icon">&#9917;</span>Sport
      </button>
      <button class="cat-btn" onclick="startQuiz('Underholdning')">
        <span class="icon">&#127916;</span>Underholdning
      </button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="hidden">
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress"></div></div>
    <div class="quiz-header">
      <span id="q-counter">Question 1 / 10</span>
      <span class="category-tag" id="q-category"></span>
      <span class="timer" id="timer">15</span>
    </div>
    <div class="question-text" id="q-text"></div>
    <div class="answers" id="answers"></div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="screen-results" class="hidden"></div>
</div>

<script src="/achievements.js"></script>
<script>
const QUESTIONS = [
  // ===== VITENSKAP (10) =====
  {cat:"Vitenskap",q:"Hva er det kjemiske symbolet for gull?",a:["Au","Ag","Fe","Cu"],c:0},
  {cat:"Vitenskap",q:"Hvor mange bein har et voksent menneske?",a:["206","208","196","212"],c:0},
  {cat:"Vitenskap",q:"Hvilken planet kalles den røde planeten?",a:["Mars","Venus","Jupiter","Saturn"],c:0},
  {cat:"Vitenskap",q:"Hvilken gass tar planter opp fra atmosfæren?",a:["Karbondioksid","Oksygen","Nitrogen","Hydrogen"],c:0},
  {cat:"Vitenskap",q:"Omtrent hvor fort er lysets hastighet i km/s?",a:["300 000","150 000","500 000","1 000 000"],c:0},
  {cat:"Vitenskap",q:"Hva kalles cellens kraftverk?",a:["Mitokondriene","Cellekjernen","Ribosomet","Golgiapparatet"],c:0},
  {cat:"Vitenskap",q:"Hvilket grunnstoff har atomnummer 1?",a:["Hydrogen","Helium","Litium","Karbon"],c:0},
  {cat:"Vitenskap",q:"Hvilken planet har flest måner i solsystemet?",a:["Saturn","Jupiter","Uranus","Neptun"],c:0},
  {cat:"Vitenskap",q:"Hva er det hardeste naturlige stoffet på jorden?",a:["Diamant","Kvarts","Topas","Rubin"],c:0},
  {cat:"Vitenskap",q:"Hva slags dyr er en sjøhest?",a:["Fisk","Krepsdyr","Pattedyr","Reptil"],c:0},

  // ===== HISTORIE (10) =====
  {cat:"Historie",q:"Hvilket år sluttet andre verdenskrig?",a:["1945","1944","1946","1943"],c:0},
  {cat:"Historie",q:"Hvem var Norges første konge etter 1905?",a:["Haakon VII","Olav V","Harald V","Oscar II"],c:0},
  {cat:"Historie",q:"Hvor mange hauger ble det gamle Roma bygget på?",a:["7","5","9","3"],c:0},
  {cat:"Historie",q:"Hvilket imperium bygde Machu Picchu?",a:["Inkariket","Aztekerne","Mayaene","Olmekerne"],c:0},
  {cat:"Historie",q:"Hvilket år falt Berlinmuren?",a:["1989","1991","1987","1990"],c:0},
  {cat:"Historie",q:"Hvem malte taket i Det sixtinske kapell?",a:["Michelangelo","Leonardo da Vinci","Rafael","Donatello"],c:0},
  {cat:"Historie",q:"Når ble Norge selvstendig fra Sverige?",a:["1905","1814","1900","1910"],c:0},
  {cat:"Historie",q:"Hvilket land ga Frihetsgudinnen til USA?",a:["Frankrike","Storbritannia","Tyskland","Spania"],c:0},
  {cat:"Historie",q:"Hvem oppdaget penicillin?",a:["Alexander Fleming","Louis Pasteur","Joseph Lister","Robert Koch"],c:0},
  {cat:"Historie",q:"Hvilket år sank Titanic?",a:["1912","1905","1915","1920"],c:0},

  // ===== GEOGRAFI (10) =====
  {cat:"Geografi",q:"Hva er den største ørkenen i verden?",a:["Antarktis","Sahara","Den arabiske ørken","Gobi"],c:0},
  {cat:"Geografi",q:"Hvilken elv er den lengste i verden?",a:["Nilen","Amazonas","Yangtze","Mississippi"],c:0},
  {cat:"Geografi",q:"Hva er det minste landet i verden?",a:["Vatikanstaten","Monaco","San Marino","Liechtenstein"],c:0},
  {cat:"Geografi",q:"Hva er hovedstaden i Australia?",a:["Canberra","Sydney","Melbourne","Brisbane"],c:0},
  {cat:"Geografi",q:"Hvilket hav er størst?",a:["Stillehavet","Atlanterhavet","Indiahavet","Nordishavet"],c:0},
  {cat:"Geografi",q:"I hvilken fjellkjede ligger Mount Everest?",a:["Himalaya","Andesfjellene","Alpene","Rocky Mountains"],c:0},
  {cat:"Geografi",q:"Hva er hovedstaden i Japan?",a:["Tokyo","Osaka","Kyoto","Hiroshima"],c:0},
  {cat:"Geografi",q:"Hva er Norges lengste elv?",a:["Glomma","Drammenselva","Numedalslågen","Tanaelva"],c:0},
  {cat:"Geografi",q:"Hva er det høyeste fjellet i Norge?",a:["Galdhøpiggen","Glittertind","Store Skagastølstind","Snøhetta"],c:0},
  {cat:"Geografi",q:"Hvilket land har flest naturlige innsjøer?",a:["Canada","Finland","Sverige","Russland"],c:0},

  // ===== SPORT (10) =====
  {cat:"Sport",q:"Hvor mange spillere er det på et fotballag på banen?",a:["11","10","9","12"],c:0},
  {cat:"Sport",q:"I hvilken idrett utfører man en slam dunk?",a:["Basketball","Volleyball","Tennis","Håndball"],c:0},
  {cat:"Sport",q:"Hvor mange Grand Slam-turneringer i tennis er det per år?",a:["4","5","3","6"],c:0},
  {cat:"Sport",q:"Hvilket land arrangerte sommer-OL i 2016?",a:["Brasil","Storbritannia","Kina","Japan"],c:0},
  {cat:"Sport",q:"Omtrent hvor langt er et maraton i kilometer?",a:["42,2","39,5","45,1","48,0"],c:0},
  {cat:"Sport",q:"I hvilken idrett brukes uttrykket 'birdie'?",a:["Golf","Badminton","Cricket","Tennis"],c:0},
  {cat:"Sport",q:"Hvilket land vant det første FIFA-VM i 1930?",a:["Uruguay","Brasil","Argentina","Italia"],c:0},
  {cat:"Sport",q:"Hva er Norges nasjonalsport?",a:["Langrenn","Fotball","Håndball","Skiskyting"],c:0},
  {cat:"Sport",q:"Hvem har flest VM-gull i skiskyting?",a:["Ole Einar Bjørndalen","Johannes Thingnes Bø","Martin Fourcade","Raphaël Poirée"],c:0},
  {cat:"Sport",q:"Hvor mange poeng er et mål verdt i håndball?",a:["1","2","3","Det varierer"],c:0},

  // ===== UNDERHOLDNING (9) =====
  {cat:"Underholdning",q:"Hvem regisserte filmen 'Jurassic Park'?",a:["Steven Spielberg","James Cameron","George Lucas","Ridley Scott"],c:0},
  {cat:"Underholdning",q:"Hva heter det fiktive kontinentet i Game of Thrones?",a:["Westeros","Narnia","Midgard","Tamriel"],c:0},
  {cat:"Underholdning",q:"Hvilket band spilte inn albumet 'Abbey Road'?",a:["The Beatles","The Rolling Stones","Led Zeppelin","Pink Floyd"],c:0},
  {cat:"Underholdning",q:"Hvilken farge har pillen Neo tar i filmen 'The Matrix'?",a:["Rød","Blå","Grønn","Gul"],c:0},
  {cat:"Underholdning",q:"Hva er den mest innbringende filmen gjennom tidene?",a:["Avatar","Avengers: Endgame","Titanic","Star Wars: The Force Awakens"],c:0},
  {cat:"Underholdning",q:"Hvem spiller Jack Sparrow i Pirates of the Caribbean?",a:["Johnny Depp","Orlando Bloom","Brad Pitt","Robert Downey Jr."],c:0},
  {cat:"Underholdning",q:"Hvilket år ble det originale Super Mario Bros. utgitt?",a:["1985","1983","1987","1990"],c:0},
  {cat:"Underholdning",q:"Hvilken TV-serie har en karakter som heter Walter White?",a:["Breaking Bad","Better Call Saul","The Wire","Ozark"],c:0},
  {cat:"Underholdning",q:"Hvem skrev Harry Potter-bøkene?",a:["J.K. Rowling","J.R.R. Tolkien","C.S. Lewis","Suzanne Collins"],c:0},
];

let currentQuiz = [];
let currentIndex = 0;
let score = 0;
let timerInterval = null;
let timeLeft = 0;
let answered = false;
let results = [];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz(category) {
  let pool = category === 'all' ? [...QUESTIONS] : QUESTIONS.filter(q => q.cat === category);
  // Shuffle and pick each question, also shuffle answers
  shuffle(pool);
  currentQuiz = pool.slice(0, 10).map(q => {
    // Build shuffled answer indices
    let indices = [0, 1, 2, 3];
    shuffle(indices);
    return {
      cat: q.cat,
      q: q.q,
      answers: indices.map(i => q.a[i]),
      correct: indices.indexOf(q.c)
    };
  });
  currentIndex = 0;
  score = 0;
  results = [];
  if (typeof reportEvent === 'function') { reportEvent('game_played', 'quiz'); reportEvent('quiz_category', category); }
  showScreen('quiz');
  showQuestion();
}

function showScreen(name) {
  document.getElementById('screen-category').classList.toggle('hidden', name !== 'category');
  document.getElementById('screen-quiz').classList.toggle('hidden', name !== 'quiz');
  document.getElementById('screen-results').classList.toggle('hidden', name !== 'results');
}

function showQuestion() {
  answered = false;
  const q = currentQuiz[currentIndex];
  document.getElementById('q-counter').textContent = `Spørsmål ${currentIndex + 1} / ${currentQuiz.length}`;
  document.getElementById('q-category').textContent = q.cat;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('progress').style.width = ((currentIndex) / currentQuiz.length * 100) + '%';

  const letters = ['A', 'B', 'C', 'D'];
  const answersEl = document.getElementById('answers');
  answersEl.innerHTML = '';
  q.answers.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `<span class="letter">${letters[i]}</span>${ans}`;
    btn.onclick = () => selectAnswer(i);
    answersEl.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  timeLeft = 15;
  const timerEl = document.getElementById('timer');
  timerEl.textContent = timeLeft;
  timerEl.classList.remove('warning');
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft;
    if (timeLeft <= 5) timerEl.classList.add('warning');
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timeUp();
    }
  }, 1000);
}

function timeUp() {
  if (answered) return;
  answered = true;
  const q = currentQuiz[currentIndex];
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.correct) btn.classList.add('correct');
  });
  results.push({ q: q.q, cat: q.cat, correct: q.answers[q.correct], yours: 'Ikke besvart (tiden ute)', wasCorrect: false });
  setTimeout(nextQuestion, 1500);
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  const q = currentQuiz[currentIndex];
  const btns = document.querySelectorAll('.answer-btn');
  const isCorrect = idx === q.correct;

  if (isCorrect) {
    score++;
    btns[idx].classList.add('correct');
  } else {
    btns[idx].classList.add('wrong');
    btns[q.correct].classList.add('correct');
  }
  btns.forEach(b => b.classList.add('disabled'));

  results.push({
    q: q.q,
    cat: q.cat,
    correct: q.answers[q.correct],
    yours: q.answers[idx],
    wasCorrect: isCorrect
  });

  setTimeout(nextQuestion, 1200);
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentQuiz.length) {
    showResults();
  } else {
    showQuestion();
  }
}

function showResults() {
  clearInterval(timerInterval);
  showScreen('results');
  const total = currentQuiz.length;
  if (score === total && typeof unlockAchievement === 'function') { unlockAchievement('quiz_perfect'); reportEvent('perfect_score', 'quiz'); }
  const pct = Math.round((score / total) * 100);
  const grade = pct >= 70 ? 'great' : pct >= 40 ? 'ok' : 'bad';

  let reviewHTML = results.map(r => {
    const cls = r.wasCorrect ? 'was-correct' : 'was-wrong';
    let inner = `<div class="review-q">${r.q}</div><div class="review-a">Riktig svar: <span>${r.correct}</span></div>`;
    if (!r.wasCorrect) inner += `<div class="review-your">Ditt svar: ${r.yours}</div>`;
    return `<div class="review-item ${cls}">${inner}</div>`;
  }).join('');

  document.getElementById('screen-results').innerHTML = `
    <h1>Resultater</h1>
    <div class="results-card">
      <div class="score-circle ${grade}">
        <div class="score-num">${score}/${total}</div>
        <div class="score-label">Poeng</div>
      </div>
      <div class="stats-row">
        <div class="stat"><div class="stat-val">${pct}%</div><div class="stat-lbl">Nøyaktighet</div></div>
        <div class="stat"><div class="stat-val">${score}</div><div class="stat-lbl">Riktige</div></div>
        <div class="stat"><div class="stat-val">${total - score}</div><div class="stat-lbl">Feil</div></div>
      </div>
      <button class="btn" onclick="startQuiz('all')">Spill igjen (alle)</button>
      <button class="btn btn-secondary" onclick="backToCategories()">Velg kategori</button>
    </div>
    <div class="review-section">
      <h3>Gjennomgang av svar</h3>
      ${reviewHTML}
    </div>
  `;
}

function backToCategories() {
  clearInterval(timerInterval);
  showScreen('category');
}
</script>
</body>
</html>
