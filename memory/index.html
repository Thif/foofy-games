<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  a { color: #7b8cff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  .top-bar {
    width: 100%;
    padding: 16px 24px;
  }

  .top-bar a { font-size: 14px; }

  h1 {
    font-size: 2rem;
    margin: 8px 0 16px;
    text-align: center;
    color: #fff;
  }

  .stats {
    display: flex;
    gap: 32px;
    margin-bottom: 20px;
    font-size: 1.1rem;
  }

  .stats span {
    background: #1a1a2e;
    padding: 8px 20px;
    border-radius: 8px;
    border: 1px solid #2a2a4a;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 100px);
    grid-template-rows: repeat(4, 100px);
    gap: 12px;
  }

  .card {
    perspective: 600px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-front {
    background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
    border: 2px solid #3a3a5a;
    font-size: 28px;
    color: #5a5a8a;
  }

  .card-front::after {
    content: '?';
  }

  .card-back {
    background: linear-gradient(135deg, #1e3a5f, #16213e);
    border: 2px solid #4a6a9a;
    transform: rotateY(180deg);
    font-size: 40px;
  }

  .card.matched .card-back {
    background: linear-gradient(135deg, #1e5f3a, #163e21);
    border-color: #4a9a6a;
  }

  .card.matched {
    cursor: default;
  }

  /* Win overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 15, 26, 0.92);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .overlay.show { display: flex; }

  .win-box {
    background: #1a1a2e;
    border: 2px solid #3a3a5a;
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
  }

  .win-box h2 {
    font-size: 2rem;
    color: #fff;
    margin-bottom: 20px;
  }

  .win-box p {
    font-size: 1.1rem;
    margin-bottom: 8px;
    color: #b0b0c0;
  }

  .win-box button {
    margin-top: 24px;
    padding: 12px 32px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #7b8cff;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s;
  }

  .win-box button:hover {
    background: #5a6cdf;
  }
</style>
</head>
<body>

<div class="top-bar"><a href="/">&larr; Back to games</a></div>
<h1>Memory Match</h1>

<div class="stats">
  <span>Moves: <strong id="moves">0</strong></span>
  <span>Time: <strong id="timer">0:00</strong></span>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="win-box">
    <h2>You Win!</h2>
    <p>Moves: <strong id="finalMoves"></strong></p>
    <p>Time: <strong id="finalTime"></strong></p>
    <button id="playAgain">Play Again</button>
  </div>
</div>

<script>
  const EMOJIS = ['🚀','🎸','🌈','🦊','🍕','🎲','💎','🔥'];
  let cards, flippedCards, matchedPairs, moves, seconds, timerInterval, locked;

  const grid = document.getElementById('grid');
  const movesEl = document.getElementById('moves');
  const timerEl = document.getElementById('timer');
  const overlay = document.getElementById('overlay');
  const finalMovesEl = document.getElementById('finalMoves');
  const finalTimeEl = document.getElementById('finalTime');

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function formatTime(s) {
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = formatTime(seconds);
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function handleClick(e) {
    const card = e.currentTarget;
    if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

    startTimer();
    card.classList.add('flipped');
    flippedCards.push(card);

    if (flippedCards.length === 2) {
      moves++;
      movesEl.textContent = moves;
      locked = true;

      const [a, b] = flippedCards;
      if (a.dataset.emoji === b.dataset.emoji) {
        a.classList.add('matched');
        b.classList.add('matched');
        matchedPairs++;
        flippedCards = [];
        locked = false;

        if (matchedPairs === 8) {
          stopTimer();
          finalMovesEl.textContent = moves;
          finalTimeEl.textContent = formatTime(seconds);
          setTimeout(() => overlay.classList.add('show'), 500);
        }
      } else {
        setTimeout(() => {
          a.classList.remove('flipped');
          b.classList.remove('flipped');
          flippedCards = [];
          locked = false;
        }, 800);
      }
    }
  }

  function init() {
    grid.innerHTML = '';
    overlay.classList.remove('show');
    flippedCards = [];
    matchedPairs = 0;
    moves = 0;
    seconds = 0;
    locked = false;
    stopTimer();
    movesEl.textContent = '0';
    timerEl.textContent = '0:00';

    const deck = shuffle([...EMOJIS, ...EMOJIS]);
    deck.forEach(emoji => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;
      card.innerHTML = `<div class="card-inner"><div class="card-front"></div><div class="card-back">${emoji}</div></div>`;
      card.addEventListener('click', handleClick);
      grid.appendChild(card);
    });
  }

  document.getElementById('playAgain').addEventListener('click', init);
  init();
</script>
</body>
</html>
