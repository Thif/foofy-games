<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .top-bar {
    width: 100%;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .top-bar a {
    color: #8888cc;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s;
  }
  .top-bar a:hover { color: #aaaaee; }
  h1 {
    font-size: 28px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #ccccff;
    margin-top: 8px;
  }
  .scoreboard {
    display: flex;
    gap: 60px;
    margin: 16px 0 12px;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .scoreboard span { min-width: 80px; text-align: center; }
  .player-label { color: #66ccff; }
  .ai-label { color: #ff6666; }
  canvas {
    border: 2px solid #2a2a44;
    border-radius: 4px;
    display: block;
  }
  .info {
    margin-top: 12px;
    font-size: 13px;
    color: #666688;
  }
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(15, 15, 26, 0.85);
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    font-size: 36px;
    margin-bottom: 16px;
    letter-spacing: 4px;
  }
  .overlay p {
    font-size: 18px;
    margin-bottom: 24px;
    color: #aaaacc;
  }
  .overlay button {
    padding: 12px 32px;
    font-size: 18px;
    background: #3a3a66;
    color: #e0e0e0;
    border: 2px solid #5555aa;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 1px;
  }
  .overlay button:hover { background: #4a4a88; }
  .game-wrapper { position: relative; }
</style>
</head>
<body>
<div class="top-bar">
  <a href="/">&larr; Back to games</a>
</div>
<h1>Pong</h1>
<div class="scoreboard">
  <span><span class="player-label">Player</span> <span id="playerScore">0</span></span>
  <span><span class="ai-label">AI</span> <span id="aiScore">0</span></span>
</div>
<div class="game-wrapper">
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div class="overlay" id="startOverlay">
    <h2>PONG</h2>
    <p>First to 10 wins!</p>
    <button id="startBtn">Start Game</button>
  </div>
  <div class="overlay hidden" id="gameOverOverlay">
    <h2 id="winnerText">You Win!</h2>
    <p id="finalScore"></p>
    <button id="restartBtn">Play Again</button>
  </div>
</div>
<div class="info">W / S or Arrow Up / Down to move</div>

<script>
(function () {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const WINNING_SCORE = 10;
  const PADDLE_W = 12;
  const PADDLE_H = 90;
  const PADDLE_MARGIN = 20;
  const BALL_SIZE = 10;
  const INITIAL_BALL_SPEED = 5;
  const SPEED_INCREMENT = 0.3;
  const PADDLE_SPEED = 6;
  const AI_SPEED = 4.5;

  let playerScore = 0;
  let aiScore = 0;
  let running = false;
  let animId = null;

  const keys = {};

  const player = { x: PADDLE_MARGIN, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H };
  const ai = { x: W - PADDLE_MARGIN - PADDLE_W, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, speed: INITIAL_BALL_SPEED };

  function resetBall(direction) {
    ball.x = W / 2;
    ball.y = H / 2;
    ball.speed = INITIAL_BALL_SPEED;
    const angle = (Math.random() * Math.PI / 3) - Math.PI / 6; // -30 to 30 degrees
    ball.vx = Math.cos(angle) * ball.speed * direction;
    ball.vy = Math.sin(angle) * ball.speed;
  }

  function updateScore() {
    document.getElementById('playerScore').textContent = playerScore;
    document.getElementById('aiScore').textContent = aiScore;
  }

  function movePlayer() {
    if (keys['w'] || keys['arrowup']) player.y -= PADDLE_SPEED;
    if (keys['s'] || keys['arrowdown']) player.y += PADDLE_SPEED;
    player.y = Math.max(0, Math.min(H - PADDLE_H, player.y));
  }

  function moveAI() {
    const center = ai.y + PADDLE_H / 2;
    const diff = ball.y - center;
    const deadzone = 10;
    if (Math.abs(diff) > deadzone) {
      ai.y += Math.sign(diff) * Math.min(AI_SPEED, Math.abs(diff));
    }
    ai.y = Math.max(0, Math.min(H - PADDLE_H, ai.y));
  }

  function rectCollision(bx, by, paddle) {
    return (
      bx + BALL_SIZE > paddle.x &&
      bx < paddle.x + paddle.w &&
      by + BALL_SIZE > paddle.y &&
      by < paddle.y + paddle.h
    );
  }

  function moveBall() {
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Top/bottom bounce
    if (ball.y <= 0) { ball.y = 0; ball.vy = Math.abs(ball.vy); }
    if (ball.y + BALL_SIZE >= H) { ball.y = H - BALL_SIZE; ball.vy = -Math.abs(ball.vy); }

    // Paddle collisions
    if (rectCollision(ball.x, ball.y, player) && ball.vx < 0) {
      ball.x = player.x + player.w;
      ball.speed += SPEED_INCREMENT;
      const hitPos = ((ball.y + BALL_SIZE / 2) - player.y) / PADDLE_H; // 0..1
      const angle = (hitPos - 0.5) * (Math.PI / 3); // -60 to 60 degrees
      ball.vx = Math.cos(angle) * ball.speed;
      ball.vy = Math.sin(angle) * ball.speed;
    }
    if (rectCollision(ball.x, ball.y, ai) && ball.vx > 0) {
      ball.x = ai.x - BALL_SIZE;
      ball.speed += SPEED_INCREMENT;
      const hitPos = ((ball.y + BALL_SIZE / 2) - ai.y) / PADDLE_H;
      const angle = (hitPos - 0.5) * (Math.PI / 3);
      ball.vx = -Math.cos(angle) * ball.speed;
      ball.vy = Math.sin(angle) * ball.speed;
    }

    // Scoring
    if (ball.x + BALL_SIZE < 0) {
      aiScore++;
      updateScore();
      if (aiScore >= WINNING_SCORE) return endGame();
      resetBall(1);
    }
    if (ball.x > W) {
      playerScore++;
      updateScore();
      if (playerScore >= WINNING_SCORE) return endGame();
      resetBall(-1);
    }
  }

  function draw() {
    // Background
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, W, H);

    // Center line
    ctx.setLineDash([8, 8]);
    ctx.strokeStyle = '#2a2a44';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // Paddles
    ctx.fillStyle = '#66ccff';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = '#ff6666';
    ctx.fillRect(ai.x, ai.y, ai.w, ai.h);

    // Ball
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
  }

  function gameLoop() {
    if (!running) return;
    movePlayer();
    moveAI();
    moveBall();
    draw();
    animId = requestAnimationFrame(gameLoop);
  }

  function endGame() {
    running = false;
    cancelAnimationFrame(animId);
    const overlay = document.getElementById('gameOverOverlay');
    const winnerText = document.getElementById('winnerText');
    const finalScore = document.getElementById('finalScore');
    winnerText.textContent = playerScore >= WINNING_SCORE ? 'You Win!' : 'AI Wins!';
    winnerText.style.color = playerScore >= WINNING_SCORE ? '#66ccff' : '#ff6666';
    finalScore.textContent = playerScore + ' - ' + aiScore;
    overlay.classList.remove('hidden');
  }

  function startGame() {
    playerScore = 0;
    aiScore = 0;
    updateScore();
    player.y = H / 2 - PADDLE_H / 2;
    ai.y = H / 2 - PADDLE_H / 2;
    resetBall(1);
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    running = true;
    gameLoop();
  }

  // Draw initial frame
  draw();

  document.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (['arrowup', 'arrowdown'].includes(e.key.toLowerCase())) e.preventDefault();
  });
  document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
})();
</script>
</body>
</html>
