<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easter Mistery - Hidden Egg Hunt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(15,15,26,0.92);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    border-bottom: 1px solid #2a2a3d;
    height: 48px;
  }
  #header a {
    color: #8888cc;
    text-decoration: none;
    font-size: 14px;
  }
  #header a:hover { color: #aaaaee; }
  #title {
    font-size: 18px;
    font-weight: 700;
    color: #f0c040;
    letter-spacing: 1px;
  }
  #hud {
    display: flex;
    gap: 20px;
    align-items: center;
    font-size: 14px;
  }
  #egg-counter { color: #80e080; font-weight: 600; }
  #timer { color: #e0c060; font-weight: 600; }

  /* Theme selection screen */
  #theme-select {
    position: absolute;
    top: 48px; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    background: #0f0f1a;
    z-index: 50;
  }

  #theme-select h2 {
    font-size: 2rem;
    color: #f0c040;
  }

  #theme-select p {
    color: #888;
    font-size: 1rem;
  }

  .settings {
    display: flex;
    gap: 2.5rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }

  .setting {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
  }

  .setting label {
    font-size: 0.95rem;
    color: #999;
  }

  .option-group {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .option {
    background: #1a1a2e;
    border: 2px solid #333;
    border-radius: 8px;
    padding: 0.5rem 1.2rem;
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: 600;
    color: #aaa;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .option:hover {
    border-color: #666;
    color: #ddd;
  }

  .option.selected {
    border-color: #f0c040;
    color: #f0c040;
    background: #2a2a3e;
  }

  .egg-size-option {
    padding: 0.5rem 0.8rem;
    min-height: 62px;
  }

  .theme-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.5rem;
    padding: 0 2rem;
    max-width: 900px;
  }

  .theme-card {
    cursor: pointer;
    border-radius: 12px;
    overflow: hidden;
    background: #1a1a2e;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .theme-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 30px rgba(240, 192, 64, 0.3);
  }

  .theme-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
  }

  .theme-card .label {
    padding: 0.8rem 1rem;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    color: #e0e0e0;
  }

  /* Game area */
  #game-container {
    position: absolute;
    top: 48px; left: 0; right: 0; bottom: 0;
    overflow: auto;
    display: none;
    align-items: center;
    justify-content: center;
    background: #0a0a14;
  }

  #game-layout {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: 1rem;
  }

  #scene-wrapper {
    position: relative;
    display: inline-block;
    line-height: 0;
  }

  #scene-wrapper img {
    max-height: calc(100vh - 48px);
    max-width: calc(100vw - 160px);
    display: block;
  }

  #side-panel {
    display: none;
    flex-direction: column;
    gap: 1rem;
    align-items: center;
    min-width: 120px;
    padding: 1rem 0.5rem;
  }

  #side-panel .stat {
    text-align: center;
    font-size: 0.9rem;
    color: #ccc;
  }

  #side-panel .stat span {
    display: block;
    font-size: 1.4rem;
    font-weight: 700;
    margin-top: 0.2rem;
  }

  #side-panel .stat .label {
    font-size: 0.75rem;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  #side-hint-btn {
    background: #2a2a4d;
    color: #f0c040;
    border: 1px solid #444466;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    transition: background 0.2s;
    width: 100%;
  }
  #side-hint-btn:hover { background: #3a3a6d; }

  .egg-zone {
    position: absolute;
    cursor: pointer;
    border-radius: 50%;
    z-index: 10;
  }

  .egg-zone.found {
    pointer-events: none;
  }

  .egg-zone.found::after {
    content: '';
    position: absolute;
    inset: -8px;
    border: 3px solid #00ffcc;
    border-radius: 50%;
    box-shadow: 0 0 8px 3px #00ffcc, 0 0 16px 6px rgba(0, 255, 204, 0.5);
    animation: pulse-glow 1s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px 3px #00ffcc, 0 0 16px 6px rgba(0, 255, 204, 0.5); }
    50% { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 12px 5px #00ffcc, 0 0 24px 10px rgba(0, 255, 204, 0.6); }
  }

  .miss-x {
    position: absolute;
    pointer-events: none;
    font-size: 24px;
    font-weight: bold;
    color: #ff4444;
    z-index: 20;
    animation: miss-fade 0.6s forwards;
    transform: translate(-50%, -50%);
  }

  @keyframes miss-fade {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -70%) scale(1.3); }
  }

  .sparkle {
    position: absolute;
    pointer-events: none;
    font-size: 28px;
    z-index: 20;
    animation: sparkle-pop 0.8s forwards;
    transform: translate(-50%, -50%);
  }

  .hint-circle {
    position: absolute;
    border: 3px solid rgba(0, 255, 204, 0.7);
    box-shadow: 0 0 10px 4px rgba(0, 255, 204, 0.5), 0 0 20px 8px rgba(0, 255, 204, 0.3);
    border-radius: 50%;
    pointer-events: none;
    z-index: 15;
    animation: hint-pulse 2s ease-out forwards;
    transform: translate(-50%, -50%);
  }

  @keyframes hint-pulse {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
  }

  @keyframes sparkle-pop {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -80%) scale(1.3); }
    100% { opacity: 0; transform: translate(-50%, -100%) scale(1); }
  }

  #win-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 15, 26, 0.9);
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
  }

  #win-overlay.show { display: flex; }

  #win-overlay h2 {
    font-size: 2.5rem;
    color: #ffd700;
  }

  #win-overlay p {
    font-size: 1.2rem;
    color: #ccc;
  }

  .win-buttons {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
  }

  .win-buttons button {
    padding: 0.7rem 2rem;
    font-size: 1rem;
    background: #2a2a4d;
    color: #eee;
    border: 1px solid #555;
    border-radius: 8px;
    cursor: pointer;
  }

  .win-buttons button:hover { background: #3a3a6d; }
</style>
</head>

<script src="/achievements.js"></script>
<script>
const img = document.getElementById('scene-img');
const wrapper = document.getElementById('scene-wrapper');
const counterEl = document.getElementById('egg-counter');
const timerEl = document.getElementById('timer');
const winOverlay = document.getElementById('win-overlay');
const winTime = document.getElementById('win-time');
const themeSelect = document.getElementById('theme-select');
const gameContainer = document.getElementById('game-container');
const sizeMultipliers = { '1': 0.6, '2': 1, '3': 1.6, 'mix': [0.6, 1, 1.6] };
let selectedCount = 5;
let selectedSize = '2';

document.querySelectorAll('.option-group').forEach(group => {
  group.querySelectorAll('.option').forEach(opt => {
    opt.addEventListener('click', () => {
      group.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      if (group.id === 'count-options') selectedCount = parseInt(opt.dataset.value);
      if (group.id === 'size-options') selectedSize = opt.dataset.value;
    });
  });
});

const themes = {
  castle: {

    eggs: [

      { x: 55, y: 16, color: '#9b59b6', accent: '#ffd700', pattern: 'stars' },    // in castle window
      { x: 72, y: 78, color: '#4d96ff', accent: '#ff69b4', pattern: 'swirl' },    // next to cart wheel
    ]
  },
  antarctic: {

    eggs: [

      { x: 45, y: 38, color: '#40e0d0', accent: '#fff700', pattern: 'dots' },      // at research station base

      { x: 18, y: 58, color: '#9b59b6', accent: '#ffd700', pattern: 'stars' },     // by sled dog area

      { x: 50, y: 90, color: '#40e0d0', accent: '#fff700', pattern: 'dots' },      // under table bottom-center
      { x: 35, y: 30, color: '#ffd700', accent: '#e04040', pattern: 'stripes' },   // on shelf near monitors
      { x: 70, y: 68, color: '#9b59b6', accent: '#ffd700', pattern: 'stars' },     // between food items on table
      { x: 42, y: 52, color: '#4d96ff', accent: '#ff69b4', pattern: 'swirl' },     // behind robot on floor
    ]
  },
  gym: {

    eggs: [
      { x: 92, y: 88, color: '#ff69b4', accent: '#fff', pattern: 'zigzag' },     // behind dumbbells on floor bottom-right
      { x: 8, y: 8, color: '#40e0d0', accent: '#fff700', pattern: 'dots' },       // on juice bar counter top-left
      { x: 75, y: 45, color: '#ffd700', accent: '#e04040', pattern: 'stripes' },  // behind weight bench
      { x: 30, y: 92, color: '#9b59b6', accent: '#ffd700', pattern: 'stars' },    // under yoga mat bottom area
      { x: 58, y: 72, color: '#4d96ff', accent: '#ff69b4', pattern: 'swirl' },    // next to water cooler
    ]
  },
  boat: {
    image: 'boat.png',
    eggs: [
      { x: 8, y: 18, color: '#ff69b4', accent: '#fff', pattern: 'zigzag' },      // behind deck chair top-left
      { x: 85, y: 52, color: '#40e0d0', accent: '#fff700', pattern: 'dots' },     // near shuffleboard sign
      { x: 50, y: 85, color: '#ffd700', accent: '#e04040', pattern: 'stripes' },  // near life buoy lower deck
      { x: 92, y: 90, color: '#9b59b6', accent: '#ffd700', pattern: 'stars' },    // by porthole bottom-right

    eggs: [
      { x: 10, y: 72, color: '#ff69b4', accent: '#fff', pattern: 'zigzag' },     // under cafeteria table bottom-left
      { x: 82, y: 42, color: '#40e0d0', accent: '#fff700', pattern: 'dots' },     // by fence/yard right side
      { x: 48, y: 88, color: '#ffd700', accent: '#e04040', pattern: 'stripes' },  // among dishes on table bottom
      { x: 30, y: 35, color: '#9b59b6', accent: '#ffd700', pattern: 'stars' },    // in rubble/tunnel area

      { x: 85, y: 90, color: '#ffd700', accent: '#e04040', pattern: 'stripes' },  // behind market stall bottom-right

      { x: 45, y: 90, color: '#ffd700', accent: '#e04040', pattern: 'stripes' },  // among rocks on path

let eggs = [];
let found = 0;
let totalEggs = 5;
let eggSizeMult = 1;
let startTime = null;
let timerInterval = null;
let eggCanvas = null;
let resizeHandler = null;

const allColors = [
  { color: '#ff69b4', accent: '#fff', pattern: 'zigzag' },
  { color: '#40e0d0', accent: '#fff700', pattern: 'dots' },
  { color: '#ffd700', accent: '#e04040', pattern: 'stripes' },
  { color: '#9b59b6', accent: '#ffd700', pattern: 'stars' },
  { color: '#4d96ff', accent: '#ff69b4', pattern: 'swirl' },
  { color: '#ff6347', accent: '#fff', pattern: 'dots' },
  { color: '#32cd32', accent: '#fff700', pattern: 'zigzag' },
  { color: '#ff8c00', accent: '#fff', pattern: 'stripes' },
  { color: '#dc143c', accent: '#ffd700', pattern: 'stars' },
  { color: '#00ced1', accent: '#ff69b4', pattern: 'swirl' },
  { color: '#9370db', accent: '#fff', pattern: 'dots' },
  { color: '#3cb371', accent: '#ffd700', pattern: 'zigzag' },
  { color: '#f08080', accent: '#fff', pattern: 'stripes' },
  { color: '#6495ed', accent: '#fff700', pattern: 'stars' },
  { color: '#daa520', accent: '#e04040', pattern: 'swirl' },
];

function generateEggPositions(seedPositions, count) {
  // Use seed positions first, then generate random ones that don't overlap
  const positions = [];
  const minDist = 10; // minimum % distance between eggs

  // Add seed positions up to available count
  for (let i = 0; i < Math.min(count, seedPositions.length); i++) {
    positions.push({ x: seedPositions[i].x, y: seedPositions[i].y });
  }

  // Generate remaining positions randomly, avoiding edges and overlaps
  while (positions.length < count) {
    const x = 5 + Math.random() * 90;
    const y = 5 + Math.random() * 90;
    const tooClose = positions.some(p =>
      Math.hypot(p.x - x, p.y - y) < minDist
    );
    if (!tooClose) {
      positions.push({ x, y });
    }
  }

  return positions.map((pos, i) => {
    const sizeMult = sizeMultipliers[selectedSize];
    const eggMult = Array.isArray(sizeMult) ? sizeMult[i % sizeMult.length] : sizeMult;
    return {
      ...pos,
      ...allColors[i % allColors.length],
      sizeMult: eggMult,
      found: false
    };
  });
}

function startGame(themeName) {
  if (typeof reportEvent === 'function') reportEvent('game_played', 'eastermistery');
  const theme = themes[themeName];
  totalEggs = selectedCount;
  hintUsed = false;
  document.getElementById('side-hint-btn').disabled = false;
  document.getElementById('side-hint-btn').style.opacity = '1';
  document.getElementById('side-hint-btn').style.cursor = 'pointer';
  eggs = generateEggPositions(theme.eggs, totalEggs);
  found = 0;
  startTime = null;
  clearInterval(timerInterval);
  counterEl.textContent = `0 / ${totalEggs} eggs`;
  timerEl.textContent = '0:00';

  themeSelect.style.display = 'none';
  gameContainer.style.display = 'flex';
  document.getElementById('side-panel').style.display = 'flex';
  winOverlay.classList.remove('show');

  // Clean up previous game
  wrapper.querySelectorAll('.egg-zone, .miss-x, .sparkle').forEach(el => el.remove());
  if (eggCanvas) { eggCanvas.remove(); eggCanvas = null; }
  if (resizeHandler) window.removeEventListener('resize', resizeHandler);

  img.src = theme.image;
  if (img.complete) setupScene();
  else img.onload = setupScene;
}

function backToThemes() {
  clearInterval(timerInterval);
  gameContainer.style.display = 'none';
  document.getElementById('side-panel').style.display = 'none';
  winOverlay.classList.remove('show');
  themeSelect.style.display = 'flex';
}

function setupScene() {
  const canvas = document.createElement('canvas');
  canvas.style.position = 'absolute';
  canvas.style.top = '0';
  canvas.style.left = '0';
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.pointerEvents = 'none';
  canvas.style.zIndex = '5';
  eggCanvas = canvas;
  wrapper.appendChild(canvas);

  function resizeCanvas() {
    const rect = img.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    eggs.forEach((egg) => {
      if (egg.found) return;
      const ex = (egg.x / 100) * canvas.width;
      const ey = (egg.y / 100) * canvas.height;
      const size = Math.max(8, canvas.width * 0.012) * egg.sizeMult;
      drawDecoratedEgg(ctx, ex, ey, size, egg);
    });

    // Reposition egg zones
    eggZones.forEach((zone, i) => {
      const egg = eggs[i];
      const hitSize = Math.max(30, rect.width * 0.04) * egg.sizeMult;
      const ex = (egg.x / 100) * rect.width;
      const ey = (egg.y / 100) * rect.height;
      zone.style.width = hitSize + 'px';
      zone.style.height = hitSize + 'px';
      zone.style.left = (ex - hitSize / 2) + 'px';
      zone.style.top = (ey - hitSize / 2) + 'px';
    });
  }

  resizeHandler = resizeCanvas;
  window.addEventListener('resize', resizeCanvas);

  // Create click zones
  const eggZones = [];
  eggs.forEach((egg, i) => {
    const zone = document.createElement('div');
    zone.className = 'egg-zone';
    wrapper.appendChild(zone);
    eggZones.push(zone);

    zone.addEventListener('click', (e) => {
      e.stopPropagation();
      if (egg.found) return;
      if (!startTime) startTimer();

      egg.found = true;
      found++;
      counterEl.textContent = `${found} / ${totalEggs} eggs`;
      zone.classList.add('found');

      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.textContent = '🥚✨';
      sparkle.style.left = zone.style.left;
      sparkle.style.top = zone.style.top;
      wrapper.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 800);

      resizeCanvas();
      if (found === totalEggs) win();
    });
  });

  // Miss click
  wrapper.onclick = (e) => {
    if (!startTime) startTimer();
    const rect = wrapper.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const miss = document.createElement('div');
    miss.className = 'miss-x';
    miss.textContent = '✕';
    miss.style.left = x + 'px';
    miss.style.top = y + 'px';
    wrapper.appendChild(miss);
    setTimeout(() => miss.remove(), 600);
  };

  resizeCanvas();
}

function drawDecoratedEgg(ctx, ex, ey, size, egg) {
  const rx = size * 0.7;
  const ry = size;
  ctx.save();
  ctx.translate(ex, ey);

  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  ctx.save();
  ctx.clip();

  ctx.globalAlpha = 0.9;
  ctx.fillStyle = egg.color;
  ctx.fillRect(-rx, -ry, rx * 2, ry * 2);

  const sheen = ctx.createRadialGradient(-rx * 0.3, -ry * 0.3, 0, 0, 0, ry);
  sheen.addColorStop(0, 'rgba(255,255,255,0.35)');
  sheen.addColorStop(1, 'rgba(0,0,0,0.1)');
  ctx.fillStyle = sheen;
  ctx.fillRect(-rx, -ry, rx * 2, ry * 2);

  ctx.globalAlpha = 0.8;
  ctx.strokeStyle = egg.accent;
  ctx.fillStyle = egg.accent;
  ctx.lineWidth = Math.max(0.8, size * 0.08);

  if (egg.pattern === 'zigzag') {
    ctx.beginPath();
    const step = rx * 0.35;
    for (let y = -ry; y < ry; y += step) {
      ctx.lineTo(y % (step * 2) === 0 ? -rx * 0.5 : rx * 0.5, y);
    }
    ctx.stroke();
    ctx.beginPath();
    for (let y = -ry + step / 2; y < ry; y += step) {
      ctx.lineTo(y % (step * 2) === 0 ? rx * 0.3 : -rx * 0.3, y);
    }
    ctx.stroke();
  }

  if (egg.pattern === 'dots') {
    const dotR = Math.max(1, size * 0.1);
    const positions = [
      [0, -ry * 0.5], [-rx * 0.35, -ry * 0.15], [rx * 0.35, -ry * 0.15],
      [0, ry * 0.2], [-rx * 0.35, ry * 0.55], [rx * 0.35, ry * 0.55],
      [0, ry * 0.7], [-rx * 0.2, -ry * 0.7], [rx * 0.2, ry * 0.1],
    ];
    positions.forEach(([dx, dy]) => {
      ctx.beginPath();
      ctx.arc(dx, dy, dotR, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  if (egg.pattern === 'stripes') {
    const gap = ry * 0.3;
    for (let y = -ry + gap; y < ry; y += gap) {
      ctx.beginPath();
      ctx.moveTo(-rx, y);
      ctx.lineTo(rx, y);
      ctx.stroke();
    }
  }

  if (egg.pattern === 'stars') {
    const drawStar = (cx, cy, r) => {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const method = i === 0 ? 'moveTo' : 'lineTo';
        ctx[method](cx + r * Math.cos(angle), cy + r * Math.sin(angle));
      }
      ctx.closePath();
      ctx.fill();
    };
    const starR = Math.max(1.5, size * 0.12);
    drawStar(0, -ry * 0.45, starR);
    drawStar(-rx * 0.25, ry * 0.15, starR * 0.8);
    drawStar(rx * 0.25, ry * 0.5, starR);
    drawStar(0, ry * 0.75, starR * 0.7);
  }

  if (egg.pattern === 'swirl') {
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 4; a += 0.1) {
      const r = a * size * 0.05;
      ctx.lineTo(r * Math.cos(a), r * Math.sin(a));
    }
    ctx.stroke();
  }

  ctx.restore();

  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = Math.max(0.5, size * 0.06);
  ctx.stroke();

  ctx.restore();
}

let hintUsed = false;

function showHint() {
  if (hintUsed) return;
  const unfound = eggs.filter(e => !e.found);
  if (unfound.length === 0) return;
  hintUsed = true;
  document.getElementById('side-hint-btn').disabled = true;
  document.getElementById('side-hint-btn').style.opacity = '0.4';
  document.getElementById('side-hint-btn').style.cursor = 'default';
  const egg = unfound[Math.floor(Math.random() * unfound.length)];
  const rect = img.getBoundingClientRect();
  const ex = (egg.x / 100) * rect.width;
  const ey = (egg.y / 100) * rect.height;
  const radius = rect.width * 0.12;

  const circle = document.createElement('div');
  circle.className = 'hint-circle';
  circle.style.left = ex + 'px';
  circle.style.top = ey + 'px';
  circle.style.width = radius * 2 + 'px';
  circle.style.height = radius * 2 + 'px';
  wrapper.appendChild(circle);
  setTimeout(() => circle.remove(), 2000);
}

function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const min = Math.floor(elapsed / 60);
    const sec = String(elapsed % 60).padStart(2, '0');
    timerEl.textContent = `${min}:${sec}`;
  }, 1000);
}

function win() {
  clearInterval(timerInterval);
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const min = Math.floor(elapsed / 60);
  const sec = String(elapsed % 60).padStart(2, '0');
  if (typeof unlockAchievement === 'function') { unlockAchievement('easter_5'); reportEvent('easter_scene_complete', themeName); }
  if (elapsed < 30 && typeof unlockAchievement === 'function') unlockAchievement('easter_fast');
  setTimeout(() => {
    winTime.textContent = `You found all ${totalEggs} eggs in ${min}:${sec}!`;
    winOverlay.classList.add('show');
  }, 500);
}
</script>
