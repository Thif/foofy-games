<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spillverksted — a collection of fun browser games created with love by Forest Family. Play Snake, Tetris, Pong, and more!">
  <meta property="og:title" content="Spillverksted">
  <meta property="og:description" content="A collection of fun browser games created with love by Forest Family.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <title>Spillverksted</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#games-grid" class="skip-link">Skip to games</a>

  <div class="vipps-banner">
    <div class="vipps-content">
      <span class="vipps-text">Liker du spillene? Støtt oss!</span>
      <a href="https://qr.vipps.no/28/2/01/031/DITT_VIPPS_NUMMER" target="_blank" rel="noopener" class="vipps-btn">
        <img src="https://cdn.vipps.no/images/buttons/vipps-rgb-orange.svg" alt="Vipps" style="height:28px;vertical-align:middle;" onerror="this.parentElement.textContent='Doner med Vipps'">
      </a>
    </div>
  </div>

  <header>
    <h1>Spillverksted</h1>
    <p id="player-greeting" class="player-greeting" style="display:none"></p>
    <p class="tagline">Created with ❤️ by Forest Family</p>
  </header>

  <!-- Name modal -->
  <div id="name-modal" class="name-modal-overlay">
    <div class="name-modal">
      <h2>Hva heter du?</h2>
      <input type="text" id="name-input" class="name-input" placeholder="Skriv inn navnet ditt" maxlength="30">
      <button class="name-save-btn" onclick="savePlayerName()">Lagre</button>
    </div>
  </div>

  <main class="main-layout">
    <aside id="achievements-section" class="achievements-sidebar"></aside>
    <div class="games-area">
      <div class="category-filters" id="category-filters"></div>
      <section class="games-grid" id="games-grid">
        <!-- Game cards are rendered from games.js -->
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Spillverksted</p>
  </footer>

  <script src="achievements.js"></script>
  <script src="profile.js"></script>
  <script src="games.js"></script>
  <script>renderAchievementsSection();</script>
</body>
</html>
