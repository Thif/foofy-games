<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Min profil — Spillverksted</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Profile-page-specific layout */
    body { padding: 1.5rem; display: block; }
    a { color: var(--sage); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .back-link { font-size: 0.95rem; display: inline-block; margin-bottom: 1.5rem; }
    .back-link::before { content: "\2190 "; }

    .profile-header { text-align: center; margin-bottom: 2rem; }
    .avatar {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, var(--terracotta), var(--warm-gold));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; margin: 0 auto 1rem;
      box-shadow: var(--shadow-md); color: #fff;
    }
    .profile-name { font-size: 2rem; font-weight: 800; color: var(--text-primary); font-family: var(--font-display); }
    .profile-subtitle { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.3rem; }
    .edit-link {
      display: inline-block; margin-top: 0.5rem; font-size: 0.85rem;
      color: var(--text-muted); cursor: pointer; border: 1.5px solid var(--border-soft);
      padding: 0.3rem 0.8rem; border-radius: 6px; transition: all 0.2s ease;
    }
    .edit-link:hover { color: var(--terracotta); border-color: var(--terracotta); text-decoration: none; }

    .stats-overview {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem; max-width: 700px; margin: 0 auto 2rem;
    }
    .stat-card {
      background: var(--bg-surface); border-radius: 14px; padding: 1.2rem;
      text-align: center; border: 1.5px solid var(--border-soft); box-shadow: var(--shadow-sm);
    }
    .stat-value { font-size: 2rem; font-weight: 800; color: var(--terracotta); font-family: var(--font-display); }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }

    h2 { font-size: 1.3rem; color: var(--text-primary); font-family: var(--font-display); margin-bottom: 1rem; max-width: 700px; margin-left: auto; margin-right: auto; }

    .games-stats { max-width: 700px; margin: 0 auto 2rem; }
    .game-stat-row {
      display: flex; align-items: center; gap: 0.8rem;
      background: var(--bg-surface); border: 1.5px solid var(--border-soft);
      border-radius: 12px; padding: 0.7rem 1rem; margin-bottom: 0.5rem;
      box-shadow: var(--shadow-sm);
    }
    .game-stat-icon { font-size: 1.3rem; flex-shrink: 0; }
    .game-stat-name { flex: 1; font-weight: 600; font-size: 0.95rem; color: var(--text-primary); }
    .game-stat-detail { font-size: 0.8rem; color: var(--text-muted); text-align: right; }
    .game-stat-played { color: var(--sage); font-weight: 700; }
    .game-stat-not-played { color: var(--text-faint); }

    .achievements-section { max-width: 700px; margin: 0 auto 2rem; }
    .achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.6rem; }

    .progress-bar-wrap {
      max-width: 700px; margin: 0 auto 1.5rem;
      background: var(--border-soft); border-radius: 8px; height: 12px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: linear-gradient(90deg, var(--terracotta), var(--warm-gold));
      border-radius: 8px; transition: width 0.5s;
    }
    .progress-label {
      max-width: 700px; margin: 0 auto 0.5rem;
      display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted);
    }

    /* Profile name-edit modal */
    .name-modal h3 { color: var(--text-primary); font-size: 1.3rem; font-family: var(--font-display); margin-bottom: 1rem; }
    .name-modal input {
      width: 100%; padding: 0.7rem 1rem; border: 2px solid var(--border-soft);
      border-radius: var(--radius-sm); background: var(--bg-cream); color: var(--text-primary);
      font-size: 1rem; outline: none; font-family: var(--font-body);
    }
    .name-modal input:focus { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(107, 158, 132, 0.15); }
    .name-modal button {
      margin-top: 1rem; padding: 0.6rem 2rem; border: none; border-radius: 100px;
      background: var(--sage); color: #fff; font-size: 1rem; font-weight: 700;
      cursor: pointer; font-family: var(--font-display);
      box-shadow: 0 3px 10px rgba(107, 158, 132, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .name-modal button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(107, 158, 132, 0.35); }
  </style>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" aria-label="Bytt tema">
  <span class="icon-moon">&#9789;</span>
  <span class="icon-sun">&#9788;</span>
</button>

<a href="/" class="back-link">Tilbake til spill</a>

<div class="profile-header">
  <div class="avatar" id="avatar">🎮</div>
  <div class="profile-name" id="profile-name">Spiller</div>
  <div class="profile-subtitle" id="profile-subtitle"></div>
  <a class="edit-link" onclick="showEditModal()">Endre navn</a>
</div>

<div class="stats-overview" id="stats-overview"></div>

<h2>Spillstatistikk</h2>
<div class="games-stats" id="games-stats"></div>

<div class="progress-label" id="ach-progress-label"></div>
<div class="progress-bar-wrap"><div class="progress-bar-fill" id="ach-progress-fill"></div></div>
<h2>Prestasjoner</h2>
<div class="achievements-section">
  <div class="achievements-grid" id="ach-grid"></div>
</div>

<div class="name-modal-overlay" id="edit-modal">
  <div class="name-modal">
    <h3>Endre navn</h3>
    <input type="text" id="edit-name-input" maxlength="30" placeholder="Skriv inn nytt navn">
    <button onclick="saveName()">Lagre</button>
  </div>
</div>

<script src="theme.js"></script>
<script src="achievements.js"></script>
<script>
const GAME_INFO = {
  'snake': { name: 'Snake', icon: '🐍' },
  'kingpinguin': { name: 'King Pinguin', icon: '🐧' },
  'shootballoon': { name: 'Shoot Balloon', icon: '🎈' },
  'space-invaders': { name: 'Space Invaders', icon: '👾' },
  'tetris': { name: 'Tetris', icon: '🧱' },
  'pong': { name: 'Pong', icon: '🏓' },
  'breakout': { name: 'Breakout', icon: '💥' },
  'minesweeper': { name: 'Minesweeper', icon: '💣' },
  'eastermistery': { name: 'Easter Mistery', icon: '🥚' },
  'multiply': { name: 'Gangetabellen', icon: '✖️' },
  'divide': { name: 'Divisjon', icon: '➗' },
  'memory': { name: 'Memory', icon: '🃏' },
  'math-race': { name: 'Matteløp', icon: '🔢' },
  'hangman': { name: 'Hangman', icon: '📝' },
  '2048': { name: '2048', icon: '🔲' },
  'quiz': { name: 'Quiz', icon: '🧠' },
  'ordbok': { name: 'Ordbok', icon: '📖' },
  'tre-paa-rad': { name: 'Tre på rad', icon: '❌' },
  'kabal': { name: 'Kabal', icon: '🃏' },
  'geografi': { name: 'Geografi-quiz', icon: '🌍' },
  'tegn-og-gjett': { name: 'Tegn og gjett', icon: '🎨' },
};

function getPlayerName() {
  return localStorage.getItem('foofy_player_name') || '';
}

function getGameStats() {
  return JSON.parse(localStorage.getItem('foofy_game_stats') || '{}');
}

function loadPage() {
  const name = getPlayerName();
  document.getElementById('profile-name').textContent = name || 'Spiller';
  document.getElementById('avatar').textContent = name ? name[0].toUpperCase() : '🎮';

  const stats = getGameStats();
  const gamesPlayed = stats.gamesPlayed || [];
  const perfectGames = stats.perfectGames || [];
  const unlocked = JSON.parse(localStorage.getItem('foofy_achievements') || '[]');
  const totalAchievements = ACHIEVEMENTS.length;
  const earnedAchievements = unlocked.length;

  // Join date (approximate from first achievement or now)
  const firstDate = unlocked.length > 0
    ? new Date(Math.min(...unlocked.map(a => a.date)))
    : new Date();
  const joinStr = firstDate.toLocaleDateString('no-NO', { year: 'numeric', month: 'long' });

  document.getElementById('profile-subtitle').textContent = `Spiller siden ${joinStr}`;

  // Overview stats
  const totalGames = Object.keys(GAME_INFO).length;
  document.getElementById('stats-overview').innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${gamesPlayed.length}</div>
      <div class="stat-label">Spill prøvd</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${totalGames}</div>
      <div class="stat-label">Totalt spill</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${perfectGames.length}</div>
      <div class="stat-label">Perfekte scores</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${earnedAchievements}</div>
      <div class="stat-label">Prestasjoner</div>
    </div>
  `;

  // Per-game stats
  const gamesHTML = Object.entries(GAME_INFO).map(([folder, info]) => {
    const played = gamesPlayed.includes(folder);
    const perfect = perfectGames.includes(folder);
    let detail = '';
    if (perfect) detail = '<span style="color:var(--warm-gold);">⭐ Perfekt</span>';
    else if (played) detail = '<span class="game-stat-played">✓ Spilt</span>';
    else detail = '<span class="game-stat-not-played">Ikke spilt ennå</span>';

    return `
      <div class="game-stat-row">
        <span class="game-stat-icon">${info.icon}</span>
        <span class="game-stat-name">${info.name}</span>
        <span class="game-stat-detail">${detail}</span>
      </div>
    `;
  }).join('');
  document.getElementById('games-stats').innerHTML = gamesHTML;

  // Achievements
  const unlockedIds = new Set(unlocked.map(a => a.id));
  const pct = totalAchievements > 0 ? Math.round((earnedAchievements / totalAchievements) * 100) : 0;
  document.getElementById('ach-progress-label').innerHTML = `<span>Fremgang</span><span>${earnedAchievements} / ${totalAchievements} (${pct}%)</span>`;
  document.getElementById('ach-progress-fill').style.width = pct + '%';

  const achHTML = ACHIEVEMENTS.map(a => {
    const isUnlocked = unlockedIds.has(a.id);
    return `
      <div class="achievement-card ${isUnlocked ? 'unlocked' : 'locked'}" title="${a.description}">
        <span class="achievement-icon">${a.icon}</span>
        <div class="achievement-info">
          <div class="achievement-name">${a.name}</div>
          <div class="achievement-desc">${a.description}</div>
        </div>
      </div>
    `;
  }).join('');
  document.getElementById('ach-grid').innerHTML = achHTML;
}

function showEditModal() {
  document.getElementById('edit-name-input').value = getPlayerName();
  document.getElementById('edit-modal').classList.add('visible');
  document.getElementById('edit-name-input').focus();
}

function saveName() {
  const name = document.getElementById('edit-name-input').value.trim();
  if (!name) return;
  localStorage.setItem('foofy_player_name', name);
  document.getElementById('edit-modal').classList.remove('visible');
  loadPage();
}

document.getElementById('edit-name-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') saveName();
});

loadPage();
</script>
</body>
</html>
